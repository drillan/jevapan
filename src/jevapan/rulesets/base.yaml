version: 1
categories:
  - name: structure
    description: "段落・節が一つの話題でまとまり、見出しが内容を具体的に指しているか評価する"
    levels:
      - "段落に複数の話題が混ざり、段落の先頭文を読んでも何の話か分からない。または見出しが内容を特定できない"
      - "おおむね一トピックだが、段落間の接続表現や論理の流れに弱い箇所がある"
      - "一段落一トピックで、先頭文が話題を示し、接続も明示され、見出しはその節の問いや対象を具体的に指している"
    locate: "この文は、段落の先頭文であるのに話題を示していない、前の段落との接続を担う文であるのに接続を欠いている、または内容を特定できない見出しである。対象は段落先頭文・段落間接続文・見出しのみで、補足・詳述・例示などの文は対象外。かつこの文は引用・ルール定義・悪文の説明例ではなく著者自身の記述として違反している"

  - name: clarity
    description: "指示語・抽象語の参照先が一意に決まり、未定義の術語を断りなく使っていないか評価する"
    levels:
      - "指示語や抽象的な言い回しの指す内容が文脈から一意に決まらない、または定義なしに術語が使われている"
      - "概ね明確だが、参照先が曖昧な指示語や説明不足の概念が残る"
      - "概念は種類を先に示され、指示語の参照先は文脈だけで一意に決まる"
    locate: "この文は、参照先が一意に決まらない指示語を含む、または定義なく使われた術語を含んでいる。かつこの文は引用・ルール定義・悪文の説明例ではなく著者自身の記述として違反している"

  - name: concision
    scope: both
    description: "同じ主張の繰り返し、接続・評価のためだけの空の文、または簡潔に言い換えられる回りくどい表現がないか評価する"
    levels:
      - "同じ主張を言い換えて繰り返す文、描写直後の要約の重複、または評価だけの接続文がある、または「〜てほしいもの」「〜することができる」「〜という形で」「〜を行う」のような簡潔に言い換えられる回りくどい表現が段落あたり2箇所以上ある"
      - "やや冗長な箇所があるが、主張の重複は少なく、回りくどい表現は段落あたり1箇所程度である"
      - "各文が新しい命題を加えており、繰り返し・空の接続文・回りくどい表現はない"
    levels_document:
      - "同じ主張が複数の節・段落で繰り返されている(導入・本文・まとめで同じ結論を繰り返す等)"
      - "一部の節で内容が重複しているが、大きな重複ではない"
      - "各節が異なる役割を担い、主張の重複がない"
    locate: "この文は、同じ主張の言い換えの繰り返し、接続・評価のためだけの空の文、または「〜てほしいもの」「〜することができる」「〜という形で」「〜を行う」のような簡潔に言い換えられる回りくどい表現を含む。かつこの文は引用・ルール定義・悪文の説明例ではなく著者自身の記述として違反している"

  - name: voice
    description: "例示が行為者を主語にした動作の連なりで書かれ、対象を指す語が具体的か評価する"
    levels:
      - "受動態や結果の羅列が中心で、対象を指す語が「AI」「ツール」等の広い語にぼけている"
      - "行為者主語の文もあるが、受動態や曖昧な対象語が残る"
      - "例示は行為者を主語にした動作の連なりで書かれ、対象を指す語は具体的である"
    locate: "この文は受動態による結果の羅列である、または対象を「AI」「ツール」等の広い語で、文脈上具体的に指せるのに不適切な意味でぼかしている。かつこの文は引用・ルール定義・悪文の説明例ではなく著者自身の記述として違反している"

  - name: naturalness
    description: "英語慣用句の直訳比喩(「運ぶ」「効く」「開かれた問い」等)や無生物の擬人化がないか評価する"
    levels:
      - "「運ぶ」「効く」「開かれた問い」「住んでいる」のような英語慣用句の直訳比喩や無生物の擬人化がある"
      - "翻訳調と疑わしい言い回しが一部ある"
      - "直訳比喩や擬人化はなく、述語は日本語として自然である"
    locate: "この文は「運ぶ」「効く」「開かれている」「住んでいる」等の語を、英語慣用句の直訳比喩や無生物主語の擬人化として不適切な意味で使っている。語が日本語として適切な意味で使われている場合は違反としない。かつこの文は引用・ルール定義・悪文の説明例ではなく著者自身の記述として違反している"

  - name: anglicism
    description: "ラテン文字で書かれた英単語が日本語文中に不自然に混在し、読みにくくなっていないか評価する(同一語の表記揺れは consistency の領分とし対象外)"
    levels:
      - "ラテン文字の英単語が段落あたり2語以上ある、または「flag する」のような日本語動詞化がある"
      - "ラテン文字の英単語は段落あたり1語程度で、日本語で一般に書かれる語が含まれる"
      - "ラテン文字語はAPI名・コマンド名・製品名・規格名・固有名詞・バッククォート内の識別子に限られる"
    locate: "この文は、日本語で一般に書かれる語をラテン文字の英単語で書いている、または「flag する」のように英単語を日本語動詞として使っている。API名・コマンド名・製品名・規格名・固有名詞・バッククォート内の識別子・コード引用は違反としない。かつこの文は引用・ルール定義・悪文の説明例ではなく著者自身の記述として違反している"

  - name: substance
    description: "「重要なのは」「まとめると」「〜に他ならない」等の中身のない型がないか評価する"
    levels:
      - "予告・総括・空虚な強調など、中身のない型が複数ある"
      - "中身のない型は散見される程度である"
      - "中身のない型は使われていない"
    locate: "この文は「重要なのは」「本章では」「まとめると」「〜に他ならない」「多角的に」「深掘りする」等の型を、実質的な情報を持たない予告・総括・空虚な強調として使っている。実質を持つ用法は違反としない。かつこの文は引用・ルール定義・悪文の説明例ではなく著者自身の記述として違反している"

  - name: consistency
    scope: document
    description: "用語・表記・文体が文書全体で統一されているか評価する(表記ゆれ、用語の揺れ、ですます/であるの混在を含む)"
    levels:
      - "同じ対象を指す表記・用語・文体が文書内で揺れている"
      - "概ね統一されているが一部に揺れがある"
      - "表記・用語・文体が文書全体で統一されている"
    locate: "この文は、文書内の他の箇所と異なる表記・用語・文体を使っている。かつこの文は引用・ルール定義・悪文の説明例ではなく著者自身の記述として違反している"
