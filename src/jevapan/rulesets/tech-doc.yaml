version: 1
extends: base
categories:
  - name: rigor
    description: "断定と推量が根拠に応じて使い分けられ、因果に機構が示され、単一原因への還元や「必ず」式の保証がないか評価する"
    levels:
      - "根拠のない断定、単一原因への還元、「必ず」式の保証、機構を欠いた因果主張がある"
      - "おおむね厳密だが、断定と推量の使い分けや機構の説明に曖昧さが残る"
      - "断定と推量が使い分けられ、因果には機構が一文で示されている"
    locate: "この文は根拠なき断定、単一原因への還元、または機構を示さない因果主張である。かつこの文は引用・ルール定義・悪文の説明例ではなく著者自身の記述として違反している"

  - name: reader_load
    description: "後で参照しない固有名(ファイル名・識別子)を避け、概念の初出は種類の同定を先に置くか評価する"
    levels:
      - "後で参照しない固有名・未定義の術語で読者の記憶に負荷をかけている"
      - "概ね配慮されているが、概念の初出の順序や不要な固有名に改善余地がある"
      - "情報は一段ずつ増え、概念は種類を先に示し、不要な固有名を避けている"
    locate: "この文は後で参照しない固有名(ファイル名・識別子等)を含む、または種類の同定より先に性質・制約を述べている。かつこの文は引用・ルール定義・悪文の説明例ではなく著者自身の記述として違反している"

  - name: restraint
    description: "決め台詞の独立段落・修辞疑問・太字や感嘆符の多用など過剰な演出がないか評価する"
    levels:
      - "決め台詞の独立段落、修辞疑問、太字や感嘆符の多用など演出が過剰である"
      - "演出はあるが概ね要所に限定されている"
      - "修辞は説明で足りる箇所では使われず、演出は最小限である"
    locate: "この文は修辞疑問、独立段落の決め台詞、感嘆符付きの劇的な一文など過剰な演出である。かつこの文は引用・ルール定義・悪文の説明例ではなく著者自身の記述として違反している"
