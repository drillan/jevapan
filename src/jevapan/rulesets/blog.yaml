version: 1
extends: base
categories:
  - name: voice
    threshold: 1.0   # ブログでは語り口の自由度を許容し、flag を厳しめに
  - name: restraint
    description: "決め台詞の独立段落・修辞疑問・太字や感嘆符の多用など過剰な演出がないか評価する"
    levels:
      - "決め台詞の独立段落、修辞疑問、太字や感嘆符の多用など演出が過剰である"
      - "演出はあるが概ね要所に限定されている"
      - "修辞は説明で足りる箇所では使われず、演出は最小限である"
    locate: "この文は修辞疑問、独立段落の決め台詞、感嘆符付きの劇的な一文など過剰な演出である"
  - name: honesty
    description: "確認していないことを確認したかのように書いていないか、作為的に見える例への配慮があるか評価する"
    levels:
      - "確認していないことを確認したかのように書いている、または作為的な例を隠している"
      - "おおむね誠実だが、根拠の弱い断定が残る"
      - "確認していないことは推量として書かれ、作為的に見える例には短い根拠が添えられている"
    locate: "この文は確認していないことを確認したかのように書いている"
