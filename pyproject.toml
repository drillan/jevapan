[project]
name = "jevapan"
version = "0.1.0"
description = "Semantic lint for Japanese documents, powered by TypeSafe Jev"
requires-python = ">=3.13"
dependencies = [
    "typesafe-sdk>=0.6.0",
    "pydantic>=2.13",
    "pyyaml>=6.0",
]

[project.scripts]
jevapan = "jevapan.cli:main"
jvp = "jevapan.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
    "ruff>=0.9",
    "mypy>=1.15",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevapan"]

[tool.hatch.build.targets.wheel.force-include]
"src/jevapan/rulesets" = "jevapan/rulesets"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.mypy]
strict = true
mypy_path = "src"
